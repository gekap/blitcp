name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Least privilege by default: most jobs only read the repo. Jobs that publish
# release assets escalate to `contents: write` at the job level (see `release`).
permissions:
  contents: read

jobs:
  # Create the release up front so every build job uploads its binaries straight
  # to it as RELEASE ASSETS — which do NOT count against the Actions artifact-
  # storage quota (the old upload-artifact flow did, and kept failing the release
  # with "Artifact storage quota has been hit").
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create release (if missing) + upload source script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # Use the ANNOTATED tag's message as the release notes (rich,
            # categorized). Read it via the API — checkout@v4 peels tags to
            # lightweight, so `git for-each-ref` would return the commit message.
            obj=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" --jq '.object')
            typ=$(printf '%s' "$obj" | jq -r '.type')
            sha=$(printf '%s' "$obj" | jq -r '.sha')
            notes=""
            if [ "$typ" = "tag" ]; then
              notes=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message')
            fi
            if [ -n "$notes" ]; then
              printf '%s\n' "$notes" | gh release create "$tag" --title "$tag" --notes-file -
            else
              gh release create "$tag" --title "$tag" --generate-notes
            fi
          fi
          gh release upload "$tag" fast_copy.py --clobber

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact: fast_copy
          - os: macos-latest
            name: macos-arm64
            artifact: fast_copy
          - os: windows-latest
            name: windows
            artifact: fast_copy.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version || '3.11' }}

      - name: Install cloud SDKs (bundled into the binaries)
        # Explicit and fail-loud so a release can never silently ship without
        # s3:// / az:// / gs:// support. build.py also collects whatever is
        # importable, so this guarantees all three end up in the binary.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cloud.txt
          python -c "import boto3, azure.storage.blob, google.cloud.storage, smbclient; print('cloud + SMB SDKs OK')"

      - name: Embed private update token
        # Inject the read-only update token (PRIVATE builds only) from the
        # FC_EMBEDDED_UPDATE_TOKEN secret into fast_copy.py before freezing, so
        # the binary self-updates without an env var. No secret → no token
        # (public builds stay clean). base64 keeps it off a casual `strings`.
        shell: bash
        env:
          FC_EMBEDDED_UPDATE_TOKEN: ${{ secrets.FC_EMBEDDED_UPDATE_TOKEN }}
        run: |
          if [ -n "$FC_EMBEDDED_UPDATE_TOKEN" ]; then
            b64=$(printf '%s' "$FC_EMBEDDED_UPDATE_TOKEN" | base64 | tr -d '\n')
            sed -i.bak "s|^_EMBEDDED_UPDATE_TOKEN_B64 = \"\"|_EMBEDDED_UPDATE_TOKEN_B64 = \"$b64\"|" fast_copy.py
            rm -f fast_copy.py.bak
            grep -q "_EMBEDDED_UPDATE_TOKEN_B64 = \"$b64\"" fast_copy.py \
              && echo "embedded update token (${#b64} b64 chars)" \
              || { echo "::error::token injection failed"; exit 1; }
          else
            echo "no FC_EMBEDDED_UPDATE_TOKEN secret — building without embedded token"
          fi

      - name: Build executable
        run: python build.py
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'

      - name: Rename binaries with platform suffix
        shell: bash
        run: |
          n="${{ matrix.name }}"
          if [ "$n" = "windows" ]; then
            mv dist/fast_copy.exe dist/fast_copy-$n.exe
            [ -f dist/fast_copy_gui.exe ] && mv dist/fast_copy_gui.exe dist/fast_copy_gui-$n.exe
          else
            mv dist/fast_copy dist/fast_copy-$n
            # GUI on macOS is a .app bundle → zip it; elsewhere it's a loose binary.
            if [ -d dist/fast_copy_gui.app ]; then
              (cd dist && zip -qr fast_copy_gui-$n.app.zip fast_copy_gui.app)
            elif [ -f dist/fast_copy_gui ]; then
              mv dist/fast_copy_gui dist/fast_copy_gui-$n
            fi
          fi
          ls -la dist/

      # Authenticode-sign the Windows binaries (CLI + GUI) with signtool — used
      # for private testing with your own cert (incl. a self-signed test cert).
      # Self-skips when no cert is configured, so public releases simply ship
      # unsigned Windows binaries unless WINDOWS_CERT_* secrets are set.
      # Secrets: WINDOWS_CERT_PFX_BASE64 (base64 of your .pfx), WINDOWS_CERT_PASSWORD.
      - name: Sign Windows binaries (signtool)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "::warning::WINDOWS_CERT_PFX_BASE64 not set — shipping UNSIGNED Windows binaries."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
                        Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK.' }
          Write-Host "Using $signtool"
          foreach ($f in Get-ChildItem 'dist\fast_copy*-windows.exe') {
            & $signtool sign `
              /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /d 'fast-copy' $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($f.Name)" }
            # Verify is informational: a self-signed test cert's root isn't trusted
            # on the runner, so /pa returns non-zero even though the file IS signed.
            & $signtool verify /pa /v $f.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::$($f.Name): signed OK, but chain not trusted on the runner (expected for a self-signed test cert)."
            }
          }
          Remove-Item $pfx -Force
          exit 0          # don't let verify's exit code fail the step

      - name: Upload binaries to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          shopt -s nullglob
          for f in dist/fast_copy-${{ matrix.name }}* dist/fast_copy_gui-${{ matrix.name }}*; do
            echo "Uploading $f ..."
            gh release upload "$tag" "$f" --clobber
          done

  build-macos-intel:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install x86_64 Python via python.org universal installer
        run: |
          # Download python.org universal2 installer (supports both arm64 and x86_64, targets macOS 10.9+)
          curl -fsSL https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg -o python-installer.pkg
          sudo installer -pkg python-installer.pkg -target /
          # The universal installer puts python at /usr/local/bin/python3.11
          X86_PYTHON="/usr/local/bin/python3.11"
          echo "X86_PYTHON=$X86_PYTHON" >> $GITHUB_ENV
          # Verify it works under x86_64
          arch -x86_64 "$X86_PYTHON" -c "import platform; print(f'Python arch: {platform.machine()}')"

      - name: Embed private update token
        shell: bash
        env:
          FC_EMBEDDED_UPDATE_TOKEN: ${{ secrets.FC_EMBEDDED_UPDATE_TOKEN }}
        run: |
          if [ -n "$FC_EMBEDDED_UPDATE_TOKEN" ]; then
            b64=$(printf '%s' "$FC_EMBEDDED_UPDATE_TOKEN" | base64 | tr -d '\n')
            sed -i.bak "s|^_EMBEDDED_UPDATE_TOKEN_B64 = \"\"|_EMBEDDED_UPDATE_TOKEN_B64 = \"$b64\"|" fast_copy.py
            rm -f fast_copy.py.bak
            grep -q "_EMBEDDED_UPDATE_TOKEN_B64 = \"$b64\"" fast_copy.py \
              && echo "embedded update token (${#b64} b64 chars)" \
              || { echo "::error::token injection failed"; exit 1; }
          else
            echo "no FC_EMBEDDED_UPDATE_TOKEN secret — building without embedded token"
          fi

      - name: Build x86_64 executable
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        run: |
          # PyInstaller runs in the env; build it there.
          arch -x86_64 "$X86_PYTHON" -m pip install pyinstaller --quiet --disable-pip-version-check
          # Force x86_64-compatible wheels for deps with native code (cryptography's
          # Rust ext, cffi, xxhash, paramiko's pynacl/bcrypt). On GitHub's arm64
          # macOS runners a plain install grabs arm64 wheels even under `arch -x86_64`,
          # so resolve explicitly by platform tag instead of host detection.
          PKGDIR="$RUNNER_TEMP/x86libs"
          arch -x86_64 "$X86_PYTHON" -m pip install \
            --only-binary=:all: --target "$PKGDIR" \
            --platform macosx_10_9_x86_64 \
            --platform macosx_10_12_x86_64 \
            --platform macosx_10_13_x86_64 \
            --platform macosx_11_0_x86_64 \
            --platform macosx_10_12_universal2 \
            --platform macosx_11_0_universal2 \
            xxhash paramiko cryptography cffi pynacl bcrypt PySide6
          # Optional cloud SDKs (pure-python wheels) so the frozen binary's
          # --fc-core engine can do s3://, az:// and gs://. Best-effort: a
          # failure must not block the CLI release.
          PYTHONPATH="$PKGDIR" arch -x86_64 "$X86_PYTHON" -m pip install \
            --target "$PKGDIR" \
            boto3 azure-storage-blob google-cloud-storage smbprotocol \
            || echo "::warning::cloud SDK install failed; binaries omit cloud"
          # Only collect cloud packages PyInstaller can actually find, else the
          # build errors out on a missing --collect-all target.
          CLOUD_FLAGS=""
          if PYTHONPATH="$PKGDIR" arch -x86_64 "$X86_PYTHON" -c \
              "import boto3, azure.storage.blob, google.cloud.storage" 2>/dev/null; then
            CLOUD_FLAGS="--collect-all=boto3 --collect-all=botocore --collect-all=s3transfer --collect-all=azure.storage.blob --collect-all=azure.core --collect-all=google.cloud.storage --collect-all=google.cloud --collect-all=google.api_core --collect-all=google.auth --collect-all=google.resumable_media"
          fi
          if PYTHONPATH="$PKGDIR" arch -x86_64 "$X86_PYTHON" -c "import smbclient" 2>/dev/null; then
            CLOUD_FLAGS="$CLOUD_FLAGS --collect-all=smbprotocol --collect-all=smbclient --collect-all=spnego --collect-all=pyasn1"
          fi
          # Make the x86_64 deps importable by PyInstaller's analysis/hooks.
          PYTHONPATH="$PKGDIR" arch -x86_64 "$X86_PYTHON" -m PyInstaller \
            --onefile --name fast_copy --clean --noupx --console \
            --paths "$PKGDIR" --icon assets/fast-copy.icns \
            --hidden-import=xxhash --hidden-import=paramiko $CLOUD_FLAGS \
            fast_copy.py
          file dist/fast_copy
          # GUI (best-effort — must not block the CLI release).
          PYTHONPATH="$PKGDIR" arch -x86_64 "$X86_PYTHON" -m PyInstaller \
            --onefile --windowed --name fast_copy_gui --clean --noupx \
            --paths "$PKGDIR" --icon assets/fast-copy.icns \
            --hidden-import=xxhash --hidden-import=paramiko $CLOUD_FLAGS \
            fast_copy_modern_gui.py || echo "::warning::macOS-intel GUI build failed; shipping CLI only"

      - name: Rename binaries
        run: |
          mv dist/fast_copy dist/fast_copy-macos-intel
          if [ -d dist/fast_copy_gui.app ]; then
            (cd dist && zip -qr fast_copy_gui-macos-intel.app.zip fast_copy_gui.app)
          elif [ -f dist/fast_copy_gui ]; then
            mv dist/fast_copy_gui dist/fast_copy_gui-macos-intel
          fi
          ls -la dist/

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          shopt -s nullglob
          for f in dist/fast_copy-macos-intel* dist/fast_copy_gui-macos-intel*; do
            echo "Uploading $f ..."
            gh release upload "$tag" "$f" --clobber
          done

  # Aggregation gate. The release is created up front by `prepare`, and each
  # build leg uploads directly with fail-fast:false + nullglob — so on its own a
  # failed leg (or one that produced no binary) would leave a PUBLISHED release
  # silently missing a platform. This job restores the old all-or-nothing gate:
  #   1. `needs:` both build jobs → if any leg fails, this job is skipped and the
  #      whole workflow goes red (the old `release: needs: [...]` behavior).
  #   2. it then checks every expected CLI binary is actually attached, catching
  #      the nullglob "succeeded but uploaded nothing" case. (GUI stays
  #      best-effort per the build steps, so it is NOT gated here.)
  verify-release:
    needs: [build, build-macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Ensure every platform binary is attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                   --json assets --jq '.assets[].name')
          echo "Release assets:"; echo "$assets"
          missing=0
          for expect in fast_copy-linux fast_copy-macos-arm64 \
                        fast_copy-macos-intel fast_copy-windows.exe; do
            if ! printf '%s\n' "$assets" | grep -qx "$expect"; then
              echo "::error::missing release asset: $expect"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release $tag is INCOMPLETE — a platform binary is missing"
            exit 1
          fi
          echo "All expected platform binaries are present."
